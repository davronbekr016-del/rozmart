<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROZMART</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
:root{--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#F5F5F5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
.hidden{display:none!important}
.hw{background:#fff;padding:12px 16px 14px;border-bottom:1px solid #ECECEC;position:sticky;top:0;z-index:5}
.brand{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:700;color:#E30613;letter-spacing:.4px}
.loc{font-size:13px;color:#7A7A7A}
.hd{background:#E30613;color:#fff;padding:13px 16px;font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
.hd i{font-size:21px;padding:8px;margin:-8px;cursor:pointer}
.wrap{padding:14px 16px calc(96px + var(--safe))}
h2{font-size:19px;font-weight:600;margin:0 0 12px}
#list-title{scroll-margin-top:74px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cov{background:#fff;border-radius:14px;height:150px;position:relative;overflow:hidden;padding:10px;display:flex;flex-direction:column;justify-content:flex-end}
.cov img{position:absolute;top:8px;left:8px;right:8px;height:98px;width:calc(100% - 16px);object-fit:contain}
.cov span.t{font-size:14px;font-weight:600;line-height:1.25;position:relative;z-index:2}
.cov span.n{position:absolute;top:10px;right:12px;font-size:11px;color:#A8A8A8;z-index:2}
.dash{width:26px;height:4px;background:#E30613;border-radius:2px;margin-top:6px;position:relative;z-index:2}
.card{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px}
.pcard{background:#fff;border-radius:14px;padding:9px;display:flex;flex-direction:column}
.ph{background:#fff;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#C8C8C8}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px}
.nm{font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.sub{color:#7A7A7A;font-size:11px;margin:3px 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:28px}
.mut{color:#7A7A7A;font-size:13px}
.prc{color:#E30613;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center}
.pcard .row{margin-top:auto}
.qb{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.wopt{border:1.5px solid #E8E8E8;background:#fff;border-radius:10px;padding:11px 16px;font-size:13px}
.wopt.on{border-color:#E30613}
.btn{width:100%;background:#E30613;color:#fff;border:none;border-radius:30px;padding:15px;font-size:15px;font-weight:500;font-family:inherit}
.btn:active{background:#C1050F}
.btn:disabled{opacity:.5}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#E30613;color:#fff;padding:12px 16px calc(12px + var(--safe));display:flex;justify-content:space-between;align-items:center}
.ft{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid #E8E8E8;padding:12px 16px calc(12px + var(--safe))}
.msg{text-align:center;color:#7A7A7A;padding:40px 20px;line-height:1.6}
.inp{width:100%;background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:13px;font-size:15px;font-family:inherit;color:#111;margin:6px 0 12px}
.inp:focus{outline:none;border-color:#E30613}
.inp.bad{border-color:#E30613;background:#FFF7F7}
.opt{background:#fff;border:1.5px solid #E8E8E8;border-radius:12px;padding:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.opt.on{border-color:#E30613}
.opt i{font-size:20px;color:#D5D5D5}
.opt.on i{color:#E30613}
.err{background:#FFF0F0;color:#B3050F;border-radius:10px;padding:12px;font-size:13px;line-height:1.5;margin-top:12px}
.line{display:flex;gap:11px;align-items:center}
.del{color:#B0B0B0;font-size:19px;padding:6px;margin:-6px}
</style>
</head>
<body>

<div id="screen-catalog">
  <div class="hw">
    <div class="brand">
      <div class="logo">ROZMART</div>
      <div style="display:flex;align-items:center;gap:15px">
        <div class="loc"><i class="ti ti-map-pin" style="color:#E30613"></i> Ташкент</div>
        <i class="ti ti-receipt hidden" id="my-orders"
           style="font-size:23px;color:#E30613;padding:7px;margin:-7px"></i>
      </div>
    </div>
  </div>
  <div class="wrap">
    <h2>Категории</h2>
    <div class="grid" id="categories" style="margin-bottom:20px"></div>
    <div class="row" style="margin-bottom:12px">
      <h2 id="list-title" style="margin:0">Все товары</h2>
      <span class="mut" id="list-count"></span>
    </div>
    <div class="grid" id="products"></div>
  </div>
</div>

<div id="screen-product" class="hidden">
  <div class="hd"><i class="ti ti-chevron-left" id="back"></i><span>Детали товара</span></div>
  <div class="wrap" id="product-body"></div>
  <div class="ft"><button class="btn" id="add">В корзину</button></div>
</div>

<div id="screen-cart" class="hidden">
  <div class="hd"><i class="ti ti-chevron-left" data-go="catalog"></i><span>Корзина</span></div>
  <div class="wrap" id="cart-body"></div>
  <div class="ft"><button class="btn" id="to-checkout">Оформить заказ</button></div>
</div>

<div id="screen-checkout" class="hidden">
  <div class="hd"><i class="ti ti-chevron-left" data-go="cart"></i><span>Оформление заказа</span></div>
  <div class="wrap">
    <div class="card">
      <label class="mut" for="f-name">Ваше имя</label>
      <input class="inp" id="f-name" placeholder="Как к вам обращаться">
      <label class="mut" for="f-phone">Номер телефона</label>
      <input class="inp" id="f-phone" inputmode="tel" value="+998 ">
      <label class="mut" for="f-address">Адрес доставки</label>
      <input class="inp" id="f-address" placeholder="Район, улица, дом, квартира">
      <label class="mut" for="f-comment">Комментарий к заказу</label>
      <input class="inp" id="f-comment" placeholder="Например: позвонить за 10 минут">
    </div>

    <div class="mut" style="margin:16px 0 8px">Время доставки</div>
    <div id="slots"></div>

    <div class="mut" style="margin:16px 0 8px">Способ оплаты</div>
    <div id="payments"></div>

    <div class="card" id="checkout-total"></div>
    <div class="err hidden" id="checkout-error"></div>
  </div>
  <div class="ft"><button class="btn" id="submit-order">Подтвердить заказ</button></div>
</div>

<div id="screen-orders" class="hidden">
  <div class="hd"><i class="ti ti-chevron-left" data-go="catalog"></i><span>Мои заказы</span></div>
  <div class="wrap" id="orders-body"></div>
</div>

<div id="screen-done" class="hidden">
  <div class="wrap" id="done-body" style="padding-top:40px"></div>
  <div class="ft"><button class="btn" data-go="catalog">Вернуться в каталог</button></div>
</div>

<div class="bar hidden" id="cart-bar" data-go="cart">
  <div>
    <div style="font-size:11px;opacity:.85" id="cart-count"></div>
    <div style="font-size:15px;font-weight:600" id="cart-sum"></div>
  </div>
  <div style="font-size:14px">Корзина <i class="ti ti-arrow-right"></i></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
