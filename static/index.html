<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROZMART</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
:root{
  /* в полноэкранном режиме сверху лежат часы и кнопки Telegram, снизу — жест
     «домой». Обе величины даёт сам Telegram, а env() выручает вне его */
  --safe-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  /* сначала величина от Telegram, иначе системная. max() здесь нельзя: на
     старом движке он сделал бы невалидным весь padding, а не одно значение */
  --safe-bot:var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --tabs:57px;
}
*{box-sizing:border-box}
/* боковые вырезы бывают только в альбомной ориентации, зато сразу у всего */
body{margin:0;padding-left:var(--safe-l);padding-right:var(--safe-r);background:#F5F5F5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;--gap-bottom:20px}
body.tabs-on{--gap-bottom:calc(20px + var(--tabs))}
body.action-on{--gap-bottom:88px}
body.tabs-on.action-on{--gap-bottom:calc(88px + var(--tabs))}
.hidden{display:none!important}
/* шапка цветная: под ней лежит статус-бар, а часы и заряд система рисует
   белым — на белом фоне они пропадали */
.hw{background:#E30613;padding:calc(12px + var(--safe-top)) 16px 12px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:17px;font-weight:700;color:#fff;letter-spacing:.4px;flex:none}
.search{flex:1;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.17);border-radius:12px;padding:0 12px}
/* строка адреса: до первого заказа зовёт его указать, потом показывает свой */
.addr{display:flex;align-items:center;gap:12px;background:#fff;padding:11px 16px;border-bottom:1px solid #ECECEC}
.addr .pin{width:36px;height:36px;border-radius:50%;background:#F3F3F3;display:flex;align-items:center;justify-content:center;color:#E30613;font-size:19px;flex:none}
.addr .txt{flex:1;min-width:0}
.addr .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr .s{font-size:11.5px;color:#8A8A8A;margin-top:1px}
.addr .go{color:#C4C4C4;font-size:18px}
.agree{display:flex;align-items:flex-start;gap:10px;padding:12px 2px;font-size:12.5px;line-height:1.45;color:#555}
.agree input{width:19px;height:19px;flex:none;margin:0;accent-color:#E30613}
.agree.bad{color:#B3050F}
.search i{font-size:19px;color:rgba(255,255,255,.75)}
/* 16px обязательны: на меньшем шрифте iOS зумит страницу при касании поля */
.search input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit;padding:11px 0}
.search input::placeholder{color:rgba(255,255,255,.7)}
.search .clear{color:rgba(255,255,255,.85);font-size:18px;padding:9px;margin:-9px}
.hd{background:#E30613;color:#fff;padding:calc(13px + var(--safe-top)) 16px 13px;font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
.hd i{font-size:21px;padding:8px;margin:-8px;cursor:pointer}
.wrap{padding:14px 16px calc(var(--gap-bottom) + var(--safe-bot))}
h2{font-size:19px;font-weight:600;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
/* лента категорий: занимает одну строку вместо половины экрана */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid #ECECEC;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}   /* каталог не загрузился — пустая белая полоса не нужна */
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:22px;background:#F3F3F3;font-size:13px;white-space:nowrap;color:#333;user-select:none;-webkit-tap-highlight-color:transparent}
.chip.on{background:#E30613;color:#fff}
.chip:active{opacity:.6}
.chip img{width:30px;height:30px;border-radius:50%;object-fit:contain;background:#fff}
.chip.plain{padding-left:15px;padding-right:15px}
.card{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px}
.pcard{background:#fff;border-radius:14px;padding:10px;display:flex;flex-direction:column}
.ph{background:#fff;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#C8C8C8}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px}
.nm{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.sub{color:#7A7A7A;font-size:11.5px;margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:#7A7A7A;font-size:13px}
.prc{color:#E30613;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center}
.pcard .row{margin-top:auto}
.qb{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.wopt{border:1.5px solid #E8E8E8;background:#fff;border-radius:10px;padding:11px 16px;font-size:13px}
.wopt.on{border-color:#E30613}
.btn{width:100%;background:#E30613;color:#fff;border:none;border-radius:30px;padding:15px;font-size:15px;font-weight:500;font-family:inherit}
.btn:active{background:#C1050F}
.btn:disabled{opacity:.5}
.ft{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid #E8E8E8;padding:12px calc(16px + var(--safe-r)) calc(12px + var(--safe-bot)) calc(16px + var(--safe-l))}
/* когда снизу меню, кнопка действия встаёт над ним, а отступ на жест уже учтён там */
body.tabs-on .ft{bottom:calc(var(--tabs) + var(--safe-bot));padding-bottom:12px}
/* высота задана жёстко: от неё считаются отступы содержимого, и расходиться им нельзя */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabs) + var(--safe-bot));background:#fff;border-top:1px solid #ECECEC;display:flex;padding:0 var(--safe-r) var(--safe-bot) var(--safe-l)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9A9A9A;font-size:11px;position:relative;user-select:none;-webkit-tap-highlight-color:transparent}
.tab.on{color:#E30613}
.tab:active{opacity:.55}
.tab i{font-size:22px}
.badge{position:absolute;top:3px;left:50%;margin-left:4px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#E30613;color:#fff;font-size:10px;line-height:17px;text-align:center}
.msg{text-align:center;color:#7A7A7A;padding:40px 20px;line-height:1.6}
.inp{width:100%;background:#fff;border:1px solid #E8E8E8;border-radius:12px;padding:13px;font-size:15px;font-family:inherit;color:#111;margin:6px 0 12px}
.inp:focus{outline:none;border-color:#E30613}
.inp.bad{border-color:#E30613;background:#FFF7F7}
.opt{background:#fff;border:1.5px solid #E8E8E8;border-radius:12px;padding:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.opt.on{border-color:#E30613}
.opt i{font-size:20px;color:#D5D5D5}
.opt.on i{color:#E30613}
.err{background:#FFF0F0;color:#B3050F;border-radius:10px;padding:12px;font-size:13px;line-height:1.5;margin-top:12px}
.line{display:flex;gap:11px;align-items:center}
.del{color:#B0B0B0;font-size:19px;padding:6px;margin:-6px}
</style>
</head>
<body>

<div id="screen-catalog">
  <div class="hw">
    <div class="brand">
      <div class="logo">ROZMART</div>
      <div class="search">
        <i class="ti ti-search"></i>
        <input id="q" placeholder="Поиск по каталогу" autocomplete="off" enterkeyhint="search">
        <i class="ti ti-x clear hidden" id="q-clear"></i>
      </div>
    </div>
  </div>
  <div class="addr hidden" id="addr" data-tab="profile">
    <span class="pin"><i class="ti ti-map-pin"></i></span>
    <div class="txt">
      <div class="t" id="addr-t">Укажите адрес</div>
      <div class="s" id="addr-s">Доставим за 60–90 минут</div>
    </div>
    <i class="ti ti-chevron-right go"></i>
  </div>
  <div class="chips" id="categories"></div>
  <div class="wrap">
    <div class="row" style="margin-bottom:12px">
      <h2 id="list-title" style="margin:0">Все товары</h2>
      <span class="mut" id="list-count"></span>
    </div>
    <div class="grid" id="products"></div>
  </div>
</div>

<div id="screen-product" class="hidden">
  <div class="hd"><i class="ti ti-chevron-left" id="back"></i><span>Детали товара</span></div>
  <div class="wrap" id="product-body"></div>
  <div class="ft"><button class="btn" id="add">В корзину</button></div>
</div>

<div id="screen-cart" class="hidden">
  <div class="hd"><span>Корзина</span></div>
  <div class="wrap" id="cart-body"></div>
  <div class="ft"><button class="btn" id="to-checkout">Оформить заказ</button></div>
</div>

<div id="screen-checkout" class="hidden">
  <div class="hd"><i class="ti ti-chevron-left" data-go="cart"></i><span>Оформление заказа</span></div>
  <div class="wrap">
    <div class="card">
      <label class="mut" for="f-name">Ваше имя</label>
      <input class="inp" id="f-name" placeholder="Как к вам обращаться">
      <label class="mut" for="f-phone">Номер телефона</label>
      <input class="inp" id="f-phone" inputmode="tel" value="+998 ">
      <label class="mut" for="f-address">Адрес доставки</label>
      <input class="inp" id="f-address" placeholder="Район, улица, дом, квартира">
      <label class="mut" for="f-comment">Комментарий к заказу</label>
      <input class="inp" id="f-comment" placeholder="Например: позвонить за 10 минут">
    </div>

    <div class="mut" style="margin:16px 0 8px">Время доставки</div>
    <div id="slots"></div>

    <div class="mut" style="margin:16px 0 8px">Способ оплаты</div>
    <div id="payments"></div>

    <div class="card" id="checkout-total"></div>
    <label class="agree hidden" id="agree-box">
      <input type="checkbox" id="agree">
      <span>Согласен на обработку моих данных — имени, телефона и адреса — для доставки заказа</span>
    </label>
    <div class="err hidden" id="checkout-error"></div>
  </div>
  <div class="ft"><button class="btn" id="submit-order">Подтвердить заказ</button></div>
</div>

<div id="screen-profile" class="hidden">
  <div class="hd"><span>Профиль</span></div>
  <div class="wrap">
    <div class="card">
      <label class="mut" for="p-name">Имя</label>
      <input class="inp" id="p-name" placeholder="Как к вам обращаться">
      <label class="mut" for="p-phone">Номер телефона</label>
      <input class="inp" id="p-phone" inputmode="tel" placeholder="+998 XX XXX XX XX">
      <label class="mut" for="p-address">Адрес доставки</label>
      <input class="inp" id="p-address" placeholder="Район, улица, дом, квартира">
    </div>
    <label class="agree hidden" id="p-agree-box">
      <input type="checkbox" id="p-agree">
      <span>Согласен на обработку моих данных — имени, телефона и адреса — для доставки заказа</span>
    </label>
    <div class="err hidden" id="profile-error"></div>
    <div class="mut" style="font-size:12px;text-align:center;line-height:1.6;margin-top:14px">
      Эти данные подставятся в следующий заказ. Уже оформленные не меняются.
    </div>
    <div class="hidden" id="forget"
         style="text-align:center;color:#B3050F;font-size:13px;padding:18px 0">
      Удалить мои данные
    </div>
  </div>
  <div class="ft"><button class="btn" id="save-profile">Сохранить</button></div>
</div>

<div id="screen-orders" class="hidden">
  <div class="hd"><span>Мои заказы</span></div>
  <div class="wrap" id="orders-body"></div>
</div>

<div id="screen-done" class="hidden">
  <!-- единственный экран без шапки: верхний отступ полного экрана считаем сами -->
  <div class="wrap" id="done-body" style="padding-top:calc(40px + var(--safe-top))"></div>
  <div class="ft"><button class="btn" data-go="catalog">Вернуться в каталог</button></div>
</div>

<div class="tabs hidden" id="tabs">
  <div class="tab" data-tab="catalog"><i class="ti ti-building-store"></i><span>Каталог</span></div>
  <div class="tab" data-tab="cart">
    <i class="ti ti-shopping-cart"></i><span>Корзина</span>
    <span class="badge hidden" id="tab-count"></span>
  </div>
  <div class="tab hidden" data-tab="orders" id="tab-orders">
    <i class="ti ti-receipt"></i><span>Заказы</span>
  </div>
  <div class="tab hidden" data-tab="profile" id="tab-profile">
    <i class="ti ti-user"></i><span>Профиль</span>
  </div>
</div>

<!-- версию подставляет сервер: без неё Telegram показывает скрипт из кэша -->
<script src="/static/app.js?v=__V__"></script>
</body>
</html>
